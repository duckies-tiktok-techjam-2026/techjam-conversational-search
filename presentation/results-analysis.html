<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results Analysis</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --border: #e4e7ec;
      --text: #0a0a0a;
      --heading: #0f1319;
      --muted: #8b939d;
      --label: #9aa2ac;
      --accent: #0a97c4;
      --success: #0ca678;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: #eef0f3;
      color: var(--text);
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* fixed-size slide, scaled to the viewport by the script below */
    .slide {
      position: relative;
      width: 1280px;
      height: 720px;
      flex: 0 0 auto;
      overflow: hidden;
      transform-origin: center center;
      padding: 56px 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background:
        radial-gradient(circle at 10% 8%, rgba(37, 244, 238, 0.12), transparent 42%),
        radial-gradient(circle at 92% 94%, rgba(254, 44, 85, 0.06), transparent 44%),
        var(--bg);
    }

    h1 {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.022em;
      color: var(--text);
      margin-bottom: 26px;
      text-align: center;
    }

    /* headline metrics — the scored aggregate over all 200 sessions */
    .metrics {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 34px;
    }
    .metric {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 15px;
      color: var(--muted);
      white-space: nowrap;
    }
    .metric strong {
      color: var(--success);
      font-weight: 700;
      margin-left: 6px;
      font-variant-numeric: tabular-nums;
    }
    .metric.lead strong { color: var(--accent); }

    /* per-scenario breakdown */
    table {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }
    thead th {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--label);
      padding: 0 22px 12px;
      border-bottom: 1px solid var(--border);
      text-align: right;
    }
    thead th:first-child { text-align: left; }

    tbody td {
      font-size: 17px;
      color: var(--text);
      padding: 17px 22px;
      border-bottom: 1px solid #edeff2;
      text-align: right;
    }
    tbody td:first-child {
      text-align: left;
      font-weight: 600;
      color: var(--heading);
    }
    tbody tr:last-child td {
      border-bottom: none;
      border-top: 2px solid var(--border);
      font-weight: 700;
      color: var(--heading);
    }
    .num-muted { color: var(--muted); }
  </style>
</head>
<body>
  <div class="slide" id="slide">
    <h1>Results Analysis</h1>

    <div class="metrics">
      <span class="metric lead">TechnicalScore <strong>0.824</strong></span>
      <span class="metric">HitRate@10 <strong>0.965</strong></span>
      <span class="metric">MRR <strong>0.606</strong></span>
      <span class="metric">MTTC <strong>3.00</strong></span>
      <span class="metric">Efficiency <strong>0.801</strong></span>
    </div>

    <table>
      <thead>
        <tr>
          <th>Scenario</th>
          <th>Sessions</th>
          <th>Hit@10</th>
          <th>MRR</th>
          <th>MTTC</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Buying</td>
          <td class="num-muted">80</td>
          <td>0.950</td>
          <td>0.569</td>
          <td>2.50</td>
        </tr>
        <tr>
          <td>Browsing</td>
          <td class="num-muted">80</td>
          <td>0.975</td>
          <td>0.588</td>
          <td>2.98</td>
        </tr>
        <tr>
          <td>Intent override</td>
          <td class="num-muted">30</td>
          <td>0.967</td>
          <td>0.765</td>
          <td>4.10</td>
        </tr>
        <tr>
          <td>Boundary</td>
          <td class="num-muted">10</td>
          <td>1.000</td>
          <td>0.555</td>
          <td>3.80</td>
        </tr>
        <tr>
          <td>Overall</td>
          <td>200</td>
          <td>0.965</td>
          <td>0.606</td>
          <td>3.00</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // Scale the fixed 1280x720 slide to fit whatever window it is viewed in.
    (function () {
      var slide = document.getElementById("slide");
      function fit() {
        var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
        slide.style.transform = "scale(" + s + ")";
      }
      fit();
      window.addEventListener("resize", fit);
    })();
  </script>
</body>
</html>
